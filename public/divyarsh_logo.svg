<svg viewBox="0 0 500 96" width="500" height="96" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&amp;display=swap');
      .logo-title {
        font-family: 'Plus Jakarta Sans', 'Arial Black', Impact, sans-serif;
        font-weight: 900;
        font-size: 33px;
        letter-spacing: 0.5px;
        fill: #0F3876;
      }
      .logo-subtitle {
        font-family: 'Plus Jakarta Sans', 'Arial', sans-serif;
        font-weight: 800;
        font-size: 15px;
        letter-spacing: 1.3px;
        fill: #0C7A39;
      }
      .logo-pill-text {
        font-family: 'Plus Jakarta Sans', 'Arial', sans-serif;
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.3px;
        fill: #FFFFFF;
      }
      .logo-ngo-title {
        font-family: 'Plus Jakarta Sans', 'Arial Black', sans-serif;
        font-weight: 900;
        font-size: 26px;
        letter-spacing: 1px;
        fill: #FFFFFF;
      }
      .logo-ngo-subtitle {
        font-family: 'Plus Jakarta Sans', 'Arial', sans-serif;
        font-weight: 700;
        font-size: 10.5px;
        letter-spacing: 0.2px;
        fill: #E8F5E9;
      }
    </style>

    <!-- Gradients for New Emblem -->
    <linearGradient id="embHeadBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0093EE" />
      <stop offset="100%" stop-color="#005AA6" />
    </linearGradient>

    <linearGradient id="embHeadGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#88D415" />
      <stop offset="100%" stop-color="#55A405" />
    </linearGradient>

    <linearGradient id="embBodyBlue" x1="20%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#008FEA" />
      <stop offset="45%" stop-color="#0060C4" />
      <stop offset="100%" stop-color="#002574" />
    </linearGradient>

    <linearGradient id="embBodyGreen" x1="80%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#84D016" />
      <stop offset="45%" stop-color="#46A306" />
      <stop offset="100%" stop-color="#006A20" />
    </linearGradient>

    <linearGradient id="embCross" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00B2FF" />
      <stop offset="50%" stop-color="#0082E6" />
      <stop offset="100%" stop-color="#0052B4" />
    </linearGradient>

    <linearGradient id="embLeafCenter" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3D9B04" />
      <stop offset="60%" stop-color="#64BE0C" />
      <stop offset="100%" stop-color="#84D416" />
    </linearGradient>

    <linearGradient id="embLeafLeft" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3A9604" />
      <stop offset="100%" stop-color="#7ECC14" />
    </linearGradient>

    <linearGradient id="embLeafRight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3A9604" />
      <stop offset="100%" stop-color="#7ECC14" />
    </linearGradient>

    <linearGradient id="embHandLeft" x1="0%" y1="30%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#00A2F5" />
      <stop offset="45%" stop-color="#0072CE" />
      <stop offset="100%" stop-color="#003292" />
    </linearGradient>

    <linearGradient id="embHandRight" x1="100%" y1="30%" x2="20%" y2="100%">
      <stop offset="0%" stop-color="#00A2F5" />
      <stop offset="45%" stop-color="#0072CE" />
      <stop offset="100%" stop-color="#003292" />
    </linearGradient>
  </defs>

  <!-- Left Emblem Group (scaled 0.176 to fit 88x88 box) -->
  <g transform="translate(8, 4) scale(0.176)">
    <!-- Soft circular background for emblem -->
    <circle cx="250" cy="250" r="240" fill="#F0FDF4" />

    <!-- Left Person Head -->
    <circle cx="140" cy="65" r="36" fill="url(#embHeadBlue)" />

    <!-- Right Person Head -->
    <circle cx="360" cy="65" r="36" fill="url(#embHeadGreen)" />

    <!-- Left Heart Figure (Blue) -->
    <path
      d="M 250 154
         C 224 126 182 98 128 100
         C 70 102 46 148 56 214
         C 68 288 152 352 222 342
         C 190 326 138 296 112 254
         C 84 210 92 166 128 144
         C 162 124 212 134 250 154 Z"
      fill="url(#embBodyBlue)"
    />

    <!-- Right Heart Figure (Green) -->
    <path
      d="M 250 154
         C 276 126 318 98 372 100
         C 430 102 454 148 444 214
         C 432 288 348 352 278 342
         C 310 326 362 296 388 254
         C 416 210 408 166 372 144
         C 338 124 288 134 250 154 Z"
      fill="url(#embBodyGreen)"
    />

    <!-- Medical Cross (+) in Center -->
    <g fill="url(#embCross)">
      <rect x="226" y="168" width="48" height="120" rx="6" />
      <rect x="182" y="208" width="136" height="42" rx="6" />
    </g>

    <!-- Plant Stem (Green) -->
    <path
      d="M 248 485
         C 248 440 248 385 249 375
         L 251 375
         C 252 385 252 440 252 485 Z"
      fill="#006C22"
    />

    <!-- Left Leaf -->
    <path
      d="M 250 405
         C 230 400 198 385 186 342
         C 214 340 242 368 250 405 Z"
      fill="url(#embLeafLeft)"
    />
    <path
      d="M 250 405
         C 225 385 210 365 186 342"
      stroke="#8ED818"
      stroke-width="2.5"
      stroke-linecap="round"
      fill="none"
    />

    <!-- Right Leaf -->
    <path
      d="M 250 405
         C 270 400 302 385 314 342
         C 286 340 258 368 250 405 Z"
      fill="url(#embLeafRight)"
    />
    <path
      d="M 250 405
         C 275 385 290 365 314 342"
      stroke="#8ED818"
      stroke-width="2.5"
      stroke-linecap="round"
      fill="none"
    />

    <!-- Center Leaf -->
    <path
      d="M 250 380
         C 232 355 232 320 250 294
         C 268 320 268 355 250 380 Z"
      fill="url(#embLeafCenter)"
    />
    <path
      d="M 250 380 L 250 297"
      stroke="#A0E824"
      stroke-width="2.5"
      stroke-linecap="round"
    />

    <!-- Left Blue Caring Hand -->
    <path
      d="M 238 485
         C 200 455 160 415 125 352
         C 105 315 90 280 62 274
         C 60 286 70 310 82 334
         C 70 302 62 284 40 274
         C 40 286 48 308 60 334
         C 35 285 25 264 18 248
         C 16 260 22 286 36 322
         C 52 365 82 414 126 448
         C 168 478 206 484 238 485 Z"
      fill="url(#embHandLeft)"
    />

    <!-- Right Blue Caring Hand (Symmetric) -->
    <path
      d="M 262 485
         C 300 455 340 415 375 352
         C 395 315 410 280 438 274
         C 440 286 430 310 418 334
         C 430 302 438 284 460 274
         C 460 286 452 308 440 334
         C 465 285 475 264 482 248
         C 484 260 478 286 464 322
         C 448 365 418 414 374 448
         C 332 478 294 484 262 485 Z"
      fill="url(#embHandRight)"
    />
  </g>

  <!-- Middle Typography -->
  <!-- DIVYARSH -->
  <text x="116" y="36" class="logo-title">DIVYARSH</text>
  
  <!-- HEALTH CARE INSTITUTE -->
  <text x="117" y="57" class="logo-subtitle">HEALTH CARE INSTITUTE</text>

  <!-- Blue Pill Badge: Healthcare Services & Education -->
  <rect x="117" y="67" width="232" height="21" rx="10.5" fill="#0084DE" />
  <text x="233" y="81.5" text-anchor="middle" class="logo-pill-text">Healthcare Services &amp; Education</text>

  <!-- Right NGO Badge -->
  <rect x="368" y="14" width="116" height="68" rx="16" fill="#10823F" />
  <text x="426" y="48" text-anchor="middle" class="logo-ngo-title">NGO</text>
  <text x="426" y="68" text-anchor="middle" class="logo-ngo-subtitle">Regd. No. 191267</text>
</svg>
